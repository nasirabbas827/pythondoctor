<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CFC-UHRS{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body{
            background-color: aquamarine;
        }
        h1,h2,h3,h4{
            margin: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">CFC-UHRS</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto"> <!-- Align to the right -->
                {% if not session.admin_logged_in %}
                <li class="nav-item">
                    <a class="nav-link" href="/admin/adminlogin">Admin Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/doctor/register">Doctor Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/doctor/login">Doctor Login</a>
                </li>
                {% endif %}
                {% if session.admin_logged_in %}
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">Admin Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/doctors">Doctors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
