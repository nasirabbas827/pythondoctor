{% extends 'base.html' %}

{% block title %}Edit Disease{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit Disease</h2>
    <form method="POST" action="{{ url_for('edit_disease', disease_id=disease[0]) }}">
        <div class="form-group">
            <label for="disease_name">Disease Name</label>
            <input type="text" class="form-control" id="disease_name" name="disease_name" value="{{ disease[1] }}" required>
        </div>
        <div class="form-group">
            <label for="symptoms">Symptoms</label>
            <textarea class="form-control" id="symptoms" name="symptoms" rows="3" required>{{ disease[2] }}</textarea>
        </div>
        <div class="form-group">
            <label for="precautions">Precautions</label>
            <textarea class="form-control" id="precautions" name="precautions" rows="3" required>{{ disease[3] }}</textarea>
        </div>
        <div class="form-group">
            <label for="prevention_methods">Prevention Methods</label>
            <textarea class="form-control" id="prevention_methods" name="prevention_methods" rows="3" required>{{ disease[4] }}</textarea>
        </div>
        <div class="form-group">
            <label for="medication">Medication</label>
            <input type="text" class="form-control" id="medication" name="medication" value="{{ disease[5] }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Disease</button>
    </form>
</div>
{% endblock %}
